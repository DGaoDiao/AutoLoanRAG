# Copy this file to config.ini and fill in your local credentials.

[mysql]
host=localhost
user=root
password=your_mysql_password
database=autoloan
limit=10

[redis]
host=localhost
port=6379
password=your_redis_password
db=0

[milvus]
host=localhost
port=19530
database_name=default
collection_name=autoloan

[llm]
model=your_model_name
dashscope_api_key=your_dashscope_api_key
dashscope_base_url=https://dashscope.aliyuncs.com/compatible-mode/v1

[retrieval]
parent_chunk_size=1000
child_chunk_size=300
chunk_overlap=50
retrieval_k=5
candidate_m=20

[app]
valid_sources=policy,product,application,contract,repayment,risk,vehicle
customer_service_phone=your_customer_service_phone

